<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Трекер навчання</title>
  <meta name="description" content="Трекер навчання записує, скільки часу ви витрачаєте на кожен предмет, і показує останні сім днів одним поглядом.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232347e0'/%3E%3Crect x='7' y='17' width='4.5' height='8' rx='1' fill='white'/%3E%3Crect x='13.75' y='11' width='4.5' height='14' rx='1' fill='white'/%3E%3Crect x='20.5' y='7' width='4.5' height='18' rx='1' fill='white'/%3E%3C/svg%3E">
  <script>
    /* Тема застосовується до відмальовування, щоб не було спалаху */
    try {
      var saved = localStorage.getItem("theme");
      var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;600;700;800&family=Literata:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
